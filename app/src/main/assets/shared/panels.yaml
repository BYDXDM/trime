  - { click: '✓', label: '✓' }
  - { click: '✗', label: '✗' }
  - { click: '✧', label: '✧' }

  - { click: '😀', label: '😀' }
  - { click: '😂', label: '😂' }
  - { click: '🥹', label: '🥹' }
  - { click: '😅', label: '😅' }
  - { click: '😊', label: '😊' }
  - { click: '😍', label: '😍' }
  - { click: '🤔', label: '🤔' }
  - { click: '😭', label: '😭' }
  - { click: '😡', label: '😡' }
  - { click: '🥺', label: '🥺' }

  - { click: '👍', label: '👍' }
  - { click: '👎', label: '👎' }
  - { click: '🙏', label: '🙏' }
  - { click: '👌', label: '👌' }
  - { click: '✌', label: '✌' }
  - { click: '💪', label: '💪' }
