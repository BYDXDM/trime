# =============================================================================
#  myime 符号面板 / 数字面板
#  这些键盘由 tools/sync_panels.py 同步进 trime.yaml 的 preset_keyboards 段落
#  （Trime 的 YAML 不支持跨文件 include 键盘，面板定义只能物理地待在
#    trime.yaml 里。本文件是权威版本，改这里后跑 tools/sync_panels.py）
#
#  设计约束（务必遵守，否则会错位）：
#    columns: -1      → 不按键数截断，只按权重换行
#    每行权重和 = 100
#
#  2026-10-24 重排（照搜狗布局）：
#    · 符号面板 4 列大键 + 右侧功能列（返回/上一组/下一组/123）+ 底部数字页签
#    · 每组精选 16 个符号（原 20 个中被裁的可去长按/其他组找）
#    · ↑/↓ = 上/下一个分组（循环），预设键 SymbolsUp_*/SymbolsDown_*
#    · 删除表情页（☺）与颜文字页：用户很少用，不值得单占一页
# -----------------------------------------------------------------------------

# 常用
symbols_panel:

  # ---- 第 1 行 ----
  - { click: '，', label: '，', long_click: '<', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '。', label: '。', long_click: '>', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '？', label: '？', long_click: '¿', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '！', label: '！', long_click: '¡', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: SymbolsToP2_symbols, label: '↑', width: 20 }

  # ---- 第 2 行 ----
  - { click: '、', label: '、', long_click: '\', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '；', label: '；', long_click: ';', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '：', label: '：', long_click: ':', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '“', label: '“', long_click: '‘', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: SymbolsToP2_symbols, label: '↓', width: 20 }

  # ---- 第 3 行 ----
  - { click: '”', label: '”', long_click: '’', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '…', label: '…', long_click: '——', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '（', label: '（', long_click: '(', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '）', label: '）', long_click: ')', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: Keyboard_number, label: '123', width: 20 }

  # ---- 第 4 行 ----
  - { click: '【', label: '【', long_click: '[', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '】', label: '】', long_click: ']', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '《', label: '《', long_click: '<', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: '》', label: '》', long_click: '>', swipe_up: SymbolsToP2_symbols, swipe_down: SymbolsToP1_symbols, swipe_left: SymbolsToP2_symbols, swipe_right: SymbolsToP1_symbols, width: 20 }
  - { click: BackSpace, label: '⌫', width: 20 }

  # ---- 分组页签（照搜狗的分组习惯）----
  - { click: Keyboard_letter, label: '返回', width: 16, key_text_size: 11 }
  - { click: SymbolsTab_symbols, label: '1.常用', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_cn, label: '2.中文', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_en, label: '3.英文', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_net, label: '4.网络', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_math, label: '5.数学', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_arrow, label: '6.箭头', width: 12, key_text_size: 11 }
  - { click: SymbolsTab_symbols_num, label: '7.序号', width: 12, key_text_size: 11 }

