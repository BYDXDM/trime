# =============================================================================
#  myime 符号面板 / 数字面板 / 表情面板
#  这三个键盘用 `include` 到 trime.yaml 的 preset_keyboards 下使用
#  （Trime 的 YAML 不支持跨文件 include 键盘，实际做法是把下面内容
#    直接贴在 preset_keyboards: 段落里。本文件是权威版本，改这里后
#    用 tools/sync_panels.py 同步进 trime.yaml）
#
#  设计约束（务必遵守，否则会错位）：
#    columns: -1      → 不按键数截断，只按权重换行
#    每行权重和 = 100
# =============================================================================

# -----------------------------------------------------------------------------
#  符号面板（中文标点为主，长按出英文/变体）
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
#  符号面板（照搜狗的分组习惯拆成 7 组，每组末行是分组页签）
#  页签用 SymbolsTab_<键盘名> 预设，定义在 trime.yaml 的 preset_keys 里
# -----------------------------------------------------------------------------

# 常用
symbols_panel:

  # ---- 第 1 行 ----
  - { click: '，', label: '，', long_click: '<', swipe_up: '〈' }
  - { click: '。', label: '。', long_click: '>', swipe_up: '〉' }
  - { click: '？', label: '？', long_click: '¿', swipe_up: '?' }
  - { click: '！', label: '！', long_click: '¡', swipe_up: '!' }
  - { click: '、', label: '、', long_click: '\', swipe_up: '|' }
  - { click: '；', label: '；', long_click: ';', swipe_up: ':' }
  - { click: '：', label: '：', long_click: ':', swipe_up: '；' }
  - { click: '“', label: '“', long_click: '‘', swipe_up: '「' }
  - { click: '”', label: '”', long_click: '’', swipe_up: '」' }
  - { click: '…', label: '…', long_click: '——', swipe_up: '·' }

  # ---- 第 2 行 ----
  - { click: '（', label: '（', long_click: '(', swipe_up: '{' }
  - { click: '）', label: '）', long_click: ')', swipe_up: '}' }
  - { click: '【', label: '【', long_click: '[', swipe_up: '〈' }
  - { click: '】', label: '】', long_click: ']', swipe_up: '〉' }
  - { click: '《', label: '《', long_click: '<', swipe_up: '〈' }
  - { click: '》', label: '》', long_click: '>', swipe_up: '〉' }
  - { click: '「', label: '「', long_click: '『', swipe_up: '“' }
  - { click: '」', label: '」', long_click: '』', swipe_up: '”' }
  - { click: '～', label: '～', long_click: '~', swipe_up: '≈' }
  - { click: '·', label: '·', long_click: '•', swipe_up: '◦' }

  # ---- 分组页签（照搜狗的分组习惯）----
  - { click: SymbolsTab_symbols, label: '1.常用', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_cn, label: '2.中文', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_en, label: '3.英文', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_net, label: '4.网络', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_math, label: '5.数学', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_arrow, label: '6.箭头', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_symbols_num, label: '7.序号', width: 11, key_text_size: 11 }
  - { click: SymbolsTab_kaomoji, label: '8.颜文字', width: 11, key_text_size: 11 }
  - { click: Keyboard_letter, label: 'ABC', width: 12, key_text_size: 11 }

  # ---- 底栏 ----
  - { click: Keyboard_number, label: '123' }
  - { click: Keyboard_emoji, label: '☺' }
  - { click: space, width: 40, label: '空格' }
  - { click: ',', label: '，' }
  - { click: Mode_switch, label: '中英', long_click: Menu, width: 15 }
  - { click: Return, label: '⏎', composing: Return1, long_click: CommitComment, width: 15 }

