# =============================================================================
#  myime —— Trime 二次开发主题
#  布局对照参考图：Q行10键 / A行9键 / Z行7键 / 底栏7键
#  键宽总权重 = 100（10列 × 10），每行必须严格等于 100，否则 Keyboard.kt 会
#  按 `x + widthPx > allowedWidth` 自动换行，导致整行错位。
#  改键宽后请跑：python3 tools/check_layout.py
# =============================================================================
config_version: "3.0"
name: myime
author: myime

style:
  # ---- 字体 ----
  key_font: latin.ttf
  label_font: latin.ttf
  preview_font: latin.ttf
  text_font: latin.ttf
  candidate_font: han.ttf
  comment_font: comment.ttf
  hanb_font: hanb.ttf
  latin_font: latin.ttf
  symbol_font: symbol.ttf

  # ---- 字号 ----
  key_text_size: 22          # 按键字母
  key_long_text_size: 14
  label_text_size: 13        # ★ 参考图里字母上方的小数字/符号
  # 键顶角标（labelSymbol）用的字号。注意 KeyView.drawSymbol 读的是
  # symbolTextSize，不是 label_text_size —— 后者目前对本用途无效。
  # 10 太小、与字母 22 对比不明显，调到 13 让角标可辨认。
  symbol_text_size: 13
  # ⚠ 单位是 sp（代码里过 sp()）。字号必须和下面的 candidate_view_height 配套：
  #   候选文字现在不缩放（scaleMode = Mode.None），框比字矮就会把字上下裁掉。
  #   经验值是「字体像素高 ≈ sp 值 × 密度 × 1.45」，所以
  #   candidate_view_height(px) ≥ candidate_text_size × 密度 × 1.45。
  #   本机密度 3.0：18sp → 约 78px，配 34dp(102px) 的框，余量充足。
  candidate_text_size: 18
  comment_text_size: 12        # 注释/拼音，同样过 sp()
  preview_text_size: 40

  # ---- 尺寸 ----
  key_width: 10.0            # 单键占屏宽百分比 → 10 键铺满
  key_height: 52             # 参考图键高偏高
  horizontal_gap: 1
  vertical_gap: 1
  round_corner: 8            # 参考图圆角按键
  shadow_radius: 0.0
  keyboard_height: 250       # 锁定键盘总高，避免切换键盘时高度跳动
  keyboard_height_land: 200
  candidate_padding: 6         # 候选之间的内边距（dp）
  # ⚠ 这个值会被 max(spacing, dp(spacing)) 放大，而且**直接从每个候选格子宽度里扣**：
  #   CompactCandidateDelegate 里 layoutMinWidth = w/列数 - separator.intrinsicWidth。
  #   填 16 实际就是 48px，格子被扣掉 48px，文字再被等比缩放 → 候选被挤成细条甚至看不见。
  #   填 6 → 实际 18px，既看得出间隔，又只占 1/6 的格宽。
  candidate_spacing: 6
  # 候选格子高度（dp）。必须容得下 candidate_text_size 的字体像素高，
  # 否则上下会被裁掉（文字不缩放，放不下就是溢出/裁切）。
  # 密度 3.0 下：32dp = 96px，恰好包住 18sp（约 78px）并留出余量。
  candidate_view_height: 32
  comment_height: 12
  preview_height: 60
  preview_offset: -12

  # ---- 布局 ----
  comment_position: right
  auto_caps: false
  reset_ascii_mode_on_focus_change: false
  keyboard_padding: 0
  keyboard_padding_bottom: 0
  keyboard_padding_land: 40

  # ★★ 背景图子目录：用户图片放 <rime>/backgrounds/mybg/ 下
  background_folder: mybg

  enter_label_mode: 0
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: 换行

preedit:
  horizontal_padding: 8
  top_start_radius: 4
  top_end_radius: 4
  foreground:
    font_size: 16

window:
  insets:
    vertical: 4
    horizontal: 4
  item_padding:
    horizontal: 4
  foreground:
    label_font_size: 20
    text_font_size: 20
    comment_font_size: 16

# =============================================================================
#  配色
#  - user_light / user_dark 两个方案专供「用户自定义背景图」使用：
#    背景色值写成图片文件名即变成图片背景（ColorTable.isImageValue 判定后缀）
#    按键色用带 alpha 的 0xAAxxxxxx —— 这就是半透明蒙层，保证字母不被压住
# =============================================================================
preset_color_schemes:

  # ---- 默认浅色（对照参考图：浅灰键盘 + 白色圆角键 + 黑色字母）----
  default:
    name: 默认/myime
    author: myime
    back_color: 0xF2F3F5            # 候选区背景
    border_color: 0x33D8DBE0            # 键盘外框：调淡到 20%，近无边框
    # 候选之间的「间隔」其实是这个颜色的**色块**（CompactCandidateDelegate 的
    # separatorDrawable 用 candidateSpacing 当尺寸）。之前调到 10% alpha 等于看不见，
    # 用户反馈「没有间隔」。40% 在浅底和动图上都能看出分隔，又不抢戏。
    candidate_separator_color: 0x66E3E6EA
    candidate_text_color: 0x1A1A1A
    comment_text_color: 0x8A9099
    hilited_back_color: 0xDCE6F5
    hilited_candidate_back_color: 0x3975CE
    hilited_candidate_text_color: 0xFFFFFF
    hilited_comment_text_color: 0xDCE6F5
    hilited_key_back_color: 0x3975CE      # 按下变蓝
    hilited_key_text_color: 0xFFFFFF
    hilited_key_symbol_color: 0xE8F0FF
    hilited_text_color: 0x3975CE
    key_back_color: 0x66FFFFFF            # 按键：白色 40% 透明，背景图能透出来
    # ★ 无边框：靠 40% 白色键面与背景图自然分层，不再描边。
    #   想恢复轮廓把 alpha 调回 0x40 即可（0x40FFFFFF）。
    key_border_color: 0x00FFFFFF          # 无边框（alpha=0）
    key_symbol_color: 0xF23C4043          # 角标：深灰(95%)，压在动图上仍要看得清
    key_text_color: 0xFF1A1A1A            # 字母：近黑不透明，保证可读性
    # 键盘底：写成**文件名**即为背景图，ColorManager 会去
    # <userDataDir>/backgrounds/<background_folder>/ 找它。
    # 该文件随 APK 发布在 assets/shared/backgrounds/mybg/，
    # 由 DataManager.mirrorPackagedDirs() 自动镜像到用户目录，重装不丢。
    keyboard_back_color: preview.gif
    label_color: 0x9AA0A6
    off_key_back_color: 0xD8DBE0
    off_key_text_color: 0x1A1A1A
    on_key_back_color: 0x3975CE
    on_key_text_color: 0xFFFFFF
    preview_back_color: 0xCC1A1A1A
    preview_text_color: 0xFFFFFF
    shadow_color: 0x00000000
    text_color: 0x1A1A1A
    text_back_color: 0xF2F3F5

  # ---- 深色 ----
  dark:
    name: 深色/myime
    author: myime
    back_color: 0x1F2124
    border_color: 0x332C2F33          # 键盘外框：调淡到 20%
    candidate_text_color: 0xE8EAED
    comment_text_color: 0x9AA0A6
    hilited_candidate_back_color: 0x3975CE
    hilited_candidate_text_color: 0xFFFFFF
    hilited_back_color: 0x2C3038
    hilited_key_back_color: 0x3975CE
    hilited_key_text_color: 0xFFFFFF
    hilited_text_color: 0x8AB4F8
    key_back_color: 0x3C4043
    key_border_color: 0x002C2F33      # 无边框（alpha=0）
    key_symbol_color: 0x9AA0A6
    key_text_color: 0xE8EAED
    keyboard_back_color: 0x292C2F
    label_color: 0x9AA0A6
    preview_back_color: 0xCC000000
    preview_text_color: 0xFFFFFF
    shadow_color: 0x80000000
    text_color: 0xE8EAED
    text_back_color: 0x1F2124

  # ★★★ 自定义背景（浅色文字方案）：把 xxx.jpg 换成你自己的文件名 ★★★
  user_light:
    name: 自定义背景·浅
    author: myime
    # ---- 背景图：写文件名，可含子目录前缀 ----
    # keyboard_back_color: girl.jpg      # 例：<rime>/backgrounds/mybg/girl.jpg
    # candidate_back_color: girl.jpg
    # root_background: girl.jpg
    keyboard_back_color: 0x00000000      # 占位；放图后改成文件名
    candidate_back_color: 0xE6FFFFFF
    # ---- 半透明蒙层：白 70%，压在背景图上让黑字清晰可读 ----
    key_back_color: 0xB3FFFFFF           # alpha=B3(70%)
    key_border_color: 0x33FFFFFF
    hilited_key_back_color: 0xCC3975CE
    hilited_key_text_color: 0xFFFFFFFF
    key_text_color: 0xFF1A1A1A
    key_symbol_color: 0xCC3C4043
    label_color: 0xCC1A1A1A
    candidate_text_color: 0xFF1A1A1A
    comment_text_color: 0xB3767C85
    shadow_color: 0x66FFFFFF             # 亮背景配白阴影反差
    preview_back_color: 0xCC1A1A1A
    preview_text_color: 0xFFFFFFFF

  # ★★★ 自定义背景（深色文字方案）：背景很暗时用这个 ★★★
  user_dark:
    name: 自定义背景·深
    author: myime
    keyboard_back_color: 0x00000000      # 占位；放图后改成文件名
    candidate_back_color: 0xE6000000
    # ---- 半透明蒙层：黑 55%，浅色字母压在暗背景上 ----
    key_back_color: 0x8C000000           # alpha=8C(55%)
    key_border_color: 0x33FFFFFF
    hilited_key_back_color: 0xCC8AB4F8
    hilited_key_text_color: 0xFF10131A
    key_text_color: 0xFFFFFFFF
    key_symbol_color: 0xCCDADCE0
    label_color: 0xCCE8EAED
    candidate_text_color: 0xFFE8EAED
    comment_text_color: 0xB38A9099
    shadow_color: 0x99000000             # 暗背景配黑阴影
    preview_back_color: 0xCC000000
    preview_text_color: 0xFFFFFFFF

fallback_colors:
  candidate_text_color: text_color

# =============================================================================
#  按键绑定
# =============================================================================
preset_keys:
  # ---- 中英切换：参考图底栏第 6 键 ----
  Mode_switch: { toggle: ascii_mode, send: SWITCH_CHARSET, states: [ 中, EN ] }
  # ---- 键盘切换 ----
  # ---- 符号分组页签（panels.yaml 里每组末行引用）----
  Keyboard_symbols: { label: '符', send: Eisu_toggle, select: symbols }
  SymbolsTab_symbols: { label: '1.常用', send: Eisu_toggle, select: symbols }
  SymbolsTab_symbols_cn: { label: '2.中文', send: Eisu_toggle, select: symbols_cn }
  SymbolsTab_symbols_en: { label: '3.英文', send: Eisu_toggle, select: symbols_en }
  SymbolsTab_symbols_net: { label: '4.网络', send: Eisu_toggle, select: symbols_net }
  SymbolsTab_symbols_math: { label: '5.数学', send: Eisu_toggle, select: symbols_math }
  SymbolsTab_symbols_arrow: { label: '6.箭头', send: Eisu_toggle, select: symbols_arrow }
  SymbolsTab_symbols_num: { label: '7.序号', send: Eisu_toggle, select: symbols_num }
  Keyboard_number: { label: '123', send: Eisu_toggle, select: number }
  Keyboard_letter: { label: 字母, send: Eisu_toggle, select: my_pinyin }
  Keyboard_default: { label: 返回, send: Eisu_toggle, select: .default }
  # emoji 面板的入口。符号/数字面板里的 `click: Keyboard_emoji` 之前引用了
  # 一个不存在的名字 → 那两个「☺」键是哑键，已补上。
  Keyboard_emoji: { label: '☺', send: Eisu_toggle, select: emoji }
  # ---- 自定命令 ----
  IME_switch: { label: 🌐, send: LANGUAGE_SWITCH }
  Color_switch: { label: 配色, send: PROG_RED }
  Date: { label: 日期, command: date, option: "yyyy-MM-dd" }
  Time: { label: 时间, command: date, option: "HH:mm" }
  Menu: { label: 方案, send: MENU }
  Settings: { label: 设定, send: SETTINGS }
  Theme_settings: { label: 主题, send: SETTINGS, option: "theme" }
  Deploy: { label: 部署, send: FUNCTION, command: apply, option: "DEPLOY" }
  Sync: { label: 同步, send: FUNCTION, command: apply, option: "SYNC_USER_DATA" }

  # ---- 空格：长按拖动光标（iOS 手感）----
  # slide_cursor: true 会让按住空格左右拖动时发送 ← → 移动光标。
  # Trime 源码 KeyView.kt:135 的 onSlide 回调直接处理，无需改代码。
  # repeatable: true 让长按后持续触发，拖动更顺滑。
  #
  # ⚠ 注意 GestureFrame.kt:121 的坑：isLongPressed 为真时不触发 swipe，
  #   所以空格不能再配 long_click（会吃掉拖动）。原来配的 VOICE_ASSIST 已移除。
  space_cursor:
    label: 空格
    send: space
    repeatable: true
    functional: false
    slide_cursor: true

  # ---- 退格：滑动删除见键盘行内的按键条目 ----
  # ⚠ 坑：swipe_up / swipe_left / swipe_down 这类手势字段**只有写在
  #   preset_keyboards 的行内按键条目上才会被解析**。
  #   写在 preset_keys 里是死配置 —— PresetKey 模型没有这些字段
  #   （PresetKey.kt:38-55），KeyAction 从预设复制字段时也不含 swipe
  #   （KeyAction.kt:181-197）。所以滑动定义在下面各键盘的行里。
  backspace_clear:
    label: ⌫
    send: BackSpace
    repeatable: true

  # ===========================================================================
  #  以下预设从上游 Trime 补回（定义取自上游 trime.yaml L878-L913）
  #
  #  本 fork 重写 trime.yaml 时把它们删掉了，但键盘里仍在引用。
  #  名字若既不是 preset 又不是 librime 认得的按键名，
  #  KeyCode.parse 解析失败 → 该键**静默失效**（没有报错、没有日志）。
  #  copy/cut/paste/undo/redo/select_all/CommitComment/Return1 都属于这种哑键，
  #  Shift_L 则是丢了 shift_lock（自动首句大写）。
  # ===========================================================================

  # ---- 编辑类 ----
  Shift_L: { label: Shift, send: Shift_L, shift_lock: ascii_long }
  Return: { label: enter_labels, send: Return }
  Return1: { label: Enter, send: Return }
  BackSpace: { label: 退格, repeatable: true, send: BackSpace }
  space: { repeatable: false, functional: false, send: space }
  Escape: { label: Esc, send: Escape }
  Insert: { label: 插入, send: Insert }
  Delete: { label: 删除, send: Delete }

  # ---- 剪贴与撤销（Z 行长按用）----
  select_all: { label: 全选, send: Control+a }
  Clear: { label: 清除, text: "{Control+a}{BackSpace}" } # 全选并删除
  cut: { label: 剪切, send: Control+x }
  copy: { label: 复制, send: Control+c }
  paste: { label: 粘贴, send: Control+v }
  undo: { label: 撤销, send: Control+z }
  redo: { label: 重做, send: Control+Shift+z }

  # ---- rime 组合键 ----
  BackToPreviousSyllable: { label: 删音节, send: Control+BackSpace }
  CommitComment: { label: 编码, send: Control+Shift+Return }

# =============================================================================
#  键盘布局
# =============================================================================
preset_keyboards:

  # =========================================================================
  #  拼音 26 键 —— 主键盘
  #  第1行 Q..P     : 10 键, 每键下滑出数字 1-0
  #  第2行 A..L     : 半键内缩 + 9 键 + 半键 = 100
  #  第3行 Z..M     : Shift(15) + 7键(70) + BackSpace(15) = 100
  #  第4行 功能栏   : 符(10) 123(10) ，(10) 空格(30) 。(10) 中英(15) 换行(15) = 100
  # =========================================================================
  my_pinyin:
    name: 拼音26键
    author: myime
    ascii_mode: 0
    columns: -1               # -1 = 不按键数截断，只按权重(100)换行
    width: 10                # 单键默认宽度权重
    height: 52
    lock: true               # 切换 App 时记忆键盘
    label_transform: uppercase
    ascii_keyboard: my_english   # ★ 切到英文模式自动换英文键盘
    keyboard_height: 250
    key_text_offset_y: 3         # 字母稍微下移，给上方角标留位
    key_symbol_offset_y: 0
    key_hint_offset_y: 0

    keys:
    # ---------------- 第 1 行：Q W E R T Y U I O P ----------------
    # 符号用 labelSymbol（画在键**顶部**的角标），不要用 label ——
    # label 是「替换键中央文字」的字段，会让字母本身消失。
    # 不要再写 hint：hint 画在键**底部**，与 labelSymbol 取值相同时会在
    # 字母上下各出现一排同样的符号。只保留顶部角标。
    # swipe_up   = 上滑输入键顶角标那个符号（搜狗/百度同款习惯）
    # swipe_down = 下滑输入备选符号
    # click 在中文模式走拼音编码；ascii 模式下走 my_english
    - { click: 'q', label_symbol: '1', swipe_up: '1', swipe_down: '!' }
    - { click: 'w', label_symbol: '2', swipe_up: '2', swipe_down: '@' }
    - { click: 'e', label_symbol: '3', swipe_up: '3', swipe_down: '#' }
    - { click: 'r', label_symbol: '4', swipe_up: '4', swipe_down: '$' }
    - { click: 't', label_symbol: '5', swipe_up: '5', swipe_down: '%' }
    - { click: 'y', label_symbol: '6', swipe_up: '6', swipe_down: '^' }
    - { click: 'u', label_symbol: '7', swipe_up: '7', swipe_down: '&' }
    - { click: 'i', label_symbol: '8', swipe_up: '8', swipe_down: '*' }
    - { click: 'o', label_symbol: '9', swipe_up: '9', swipe_down: '(' }
    - { click: 'p', label_symbol: '0', swipe_up: '0', swipe_down: ')' }

    # ---------------- 第 2 行：A S D F G H J K L ----------------
    # 左右各 5 权重半键让 9 键居中（参考图 A 行确实内缩）
    - { width: 5 }                                   # 左占位半键
    - { click: 'a', label_symbol: '~', swipe_up: '~', swipe_down: '`' }
    - { click: 's', label_symbol: '!', swipe_up: '!', swipe_down: '¡' }
    - { click: 'd', label_symbol: '@', swipe_up: '@', swipe_down: '#' }
    - { click: 'f', label_symbol: '#', swipe_up: '#', swipe_down: '¥' }
    - { click: 'g', label_symbol: '%', swipe_up: '%', swipe_down: '‰' }
    - { click: 'h', label_symbol: '“', swipe_up: '“', swipe_down: '”' }
    - { click: 'j', label_symbol: '”', swipe_up: '”', swipe_down: '‘' }
    - { click: 'k', label_symbol: '*', swipe_up: '*', swipe_down: '×' }
    - { click: 'l', label_symbol: '?', swipe_up: '?', swipe_down: '¿' }
    - { width: 5 }                                   # 右占位半键

    # ---------------- 第 3 行：Shift Z X C V B N M BackSpace ----------------
    # 15 + 7×10 + 15 = 100  （7 个字母键等分中间 70 权重）
    # ⚠ 行尾原本还有一个 click: 'l' 的 @ 键，因与第 2 行的 l 重复已删；
    #   删键必须同步把剩下的字母键宽度补回来，否则行宽不足 100 会错位。
    - { click: Shift_L, label_symbol: '⬆', send_bindings: false, width: 15 }
    - { click: 'z', label_symbol: '(', swipe_up: '(', swipe_down: '（', width: 10 }
    - { click: 'x', label_symbol: ')', swipe_up: ')', swipe_down: '）', width: 10 }
    - { click: 'c', label_symbol: '-', swipe_up: '-', swipe_down: '_', width: 10 }
    - { click: 'v', label_symbol: '=', swipe_up: '=', swipe_down: '+', width: 10 }
    - { click: 'b', label_symbol: ':', swipe_up: ':', swipe_down: '：', width: 10 }
    - { click: 'n', label_symbol: ';', swipe_up: ';', swipe_down: '；', width: 10 }
    - { click: 'm', label_symbol: '/', swipe_up: '/', swipe_down: "\\", width: 10 }
    - { click: backspace_clear, swipe_up: Clear, swipe_left: BackToPreviousSyllable, width: 15 }

    # ---------------- 第 4 行：底栏 ----------------
    # 符(10) 123(10) ，(10) 空格(30) 。(10) 中英(15) 换行(15) = 100
    - { click: Keyboard_symbols, long_click: Keyboard_number }
    - { click: Keyboard_number, long_click: Keyboard_symbols }
    - { click: ',', label: '，', long_click: '<', swipe_up: '〈' }
    - { click: space_cursor, width: 30 }                 # 长按拖动移动光标
    - { click: '.', label: '。', long_click: '>', swipe_up: '〉' }
    - { click: Mode_switch, long_click: Menu, width: 15 }
    - { click: Return, composing: Return1, long_click: CommitComment, width: 15 }

  # =========================================================================
  #  英文 26 键
  #  行结构与拼音键盘完全一致，保证切换时高度不跳
  # =========================================================================
  my_english:
    name: English
    author: myime
    ascii_mode: 1
    reset_ascii_mode: true
    columns: -1               # -1 = 不按键数截断，只按权重(100)换行
    width: 10
    height: 52
    lock: true
    keyboard_height: 250
    key_text_offset_y: 3

    keys:
    # ---- 第 1 行 ----
    - { click: 'q', label_symbol: '1', swipe_up: '1', swipe_down: '!' }
    - { click: 'w', label_symbol: '2', swipe_up: '2', swipe_down: '@' }
    - { click: 'e', label_symbol: '3', swipe_up: '3', swipe_down: '#' }
    - { click: 'r', label_symbol: '4', swipe_up: '4', swipe_down: '$' }
    - { click: 't', label_symbol: '5', swipe_up: '5', swipe_down: '%' }
    - { click: 'y', label_symbol: '6', swipe_up: '6', swipe_down: '^' }
    - { click: 'u', label_symbol: '7', swipe_up: '7', swipe_down: '&' }
    - { click: 'i', label_symbol: '8', swipe_up: '8', swipe_down: '*' }
    - { click: 'o', label_symbol: '9', swipe_up: '9', swipe_down: '(' }
    - { click: 'p', label_symbol: '0', swipe_up: '0', swipe_down: ')' }

    # ---- 第 2 行 ----
    - { width: 5 }
    - { click: 'a', label_symbol: '~', swipe_up: '~', swipe_down: '`', long_click: select_all }
    - { click: 's', label_symbol: '!', swipe_up: '!', swipe_down: '¡', long_click: '~' }
    - { click: 'd', label_symbol: '@', swipe_up: '@', swipe_down: '#', long_click: '-' }
    - { click: 'f', label_symbol: '#', swipe_up: '#', swipe_down: '¥', long_click: '+' }
    - { click: 'g', label_symbol: '%', swipe_up: '%', swipe_down: '‰', long_click: '=' }
    - { click: 'h', label_symbol: '“', swipe_up: '“', swipe_down: '”', long_click: '"' }
    - { click: 'j', label_symbol: '”', swipe_up: '”', swipe_down: '‘', long_click: "'" }
    - { click: 'k', label_symbol: '*', swipe_up: '*', swipe_down: '×', long_click: '&' }
    - { click: 'l', label_symbol: '?', swipe_up: '?', swipe_down: '¿', long_click: '_' }
    - { width: 5 }

    # ---- 第 3 行 ----
    # 15 + 7×10 + 15 = 100  （同上：删掉重复的 l/@ 键后必须补足行宽）
    - { click: Shift_L, label_symbol: '⇧', send_bindings: false, width: 15 }
    - { click: 'z', label_symbol: '(', swipe_up: '(', swipe_down: '（', long_click: cut, width: 10 }
    - { click: 'x', label_symbol: ')', swipe_up: ')', swipe_down: '）', long_click: copy, width: 10 }
    - { click: 'c', label_symbol: '-', swipe_up: '-', swipe_down: '_', long_click: paste, width: 10 }
    - { click: 'v', label_symbol: '=', swipe_up: '=', swipe_down: '+', long_click: paste, width: 10 }
    - { click: 'b', label_symbol: ':', swipe_up: ':', swipe_down: '：', long_click: Insert, width: 10 }
    - { click: 'n', label_symbol: ';', swipe_up: ';', swipe_down: '；', long_click: undo, width: 10 }
    - { click: 'm', label_symbol: '/', swipe_up: '/', swipe_down: "\\", long_click: redo, width: 10 }
    - { click: backspace_clear, swipe_up: Clear, swipe_left: BackToPreviousSyllable, width: 15 }

    # ---- 第 4 行 ----
    - { click: Keyboard_symbols, long_click: Keyboard_number }
    - { click: Keyboard_number, long_click: Keyboard_symbols }
    - { click: ',', label: ',', long_click: '<', swipe_up: '〈' }
    - { click: space_cursor, width: 30 }
    - { click: '.', label: '.', long_click: '>', swipe_up: '〉' }
    - { click: Mode_switch, long_click: Menu, width: 15 }
    - { click: Return, composing: Return1, long_click: CommitComment, width: 15 }


