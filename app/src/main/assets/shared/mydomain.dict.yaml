# Rime dictionary
# encoding: utf-8
#
# mydomain —— myime 内置垂直领域词库
#
# 格式： 词语<TAB>拼音<TAB>权重
#   - 权重越大排序越靠前（sort: by_weight）
#   - 专有名词建议 1200~2000，普通词 700~1000
#   - 英文词条也走拼音编码位，用首字母小写串作编码（如 clash → "clash"）
#     这样打 "cl" / "clash" 都能命中
#
# 修改后请执行： python3 tools/check_dict.py 校验格式
#
---
name: mydomain
version: "1.0.0"
sort: by_weight
# ★ use_preset_vocabulary 必须为 false。
#   本词库的定位是「精选垂直领域词」（535 条），不需要 essay.txt 兜底；
#   而 essay.txt 只带「词+权重」不带拼音，它的拼音要靠词典已收集的词条反查
#   （ScriptEncoder::DfsEncode → EntryCollector::TranslateWord），
#   535 条根本给不出这个映射 —— 开着它等于把 44 万条 essay 词条**完整遍历一遍**，
#   绝大多数以 `Encode failure` 告终，纯属浪费首次部署时间（实测部署时间翻倍以上）。
#   通用词由 mymain 挂的 luna_pinyin 词典负责，不在这里重复。
use_preset_vocabulary: false
...

