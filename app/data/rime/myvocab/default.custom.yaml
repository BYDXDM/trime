#
# 用户级全局配置补丁。Rime 升级/重新部署时会 merge 本文件，
# 所以个性化设置放这里最安全（不会被方案更新覆盖）。
patch:
  # ---- 方案列表：只留我们的方案（按需保留明月拼音）----
  schema_list:
    - schema: mydomain          # 26 键拼音，内置科技/游戏词库
    - schema: luna_pinyin_simp  # 明月拼音·简化字（备用）

  # ---- 候选数量 ----
  "menu/page_size": 9

  # ---- 中英切换行为 ----
  # 左 Shift 上屏已输入内容（不切模式），避免误触
  "ascii_composer/switch_key/Shift_L": commit_text
  "ascii_composer/switch_key/Shift_R": commit_text
  "ascii_composer/switch_key/Caps_Lock": clear

  # ---- 用户词典学习（全局兜底，方案里也各自配了）----
  "translator/enable_user_dict": true
  "translator/user_dict": mydomain.user
  "translator/db_class": userdb

  # ---- 标点：中文状态下输出全角 ----
  "punctuator/half_shape": false

  # ---- 自动记忆新词 ----
  # 用户上屏的词若不在主词库，librime 会自动写入 mydomain.userdb 并提权。
  # 这是 Rime 内建行为，无需额外配置，但需要 enable_user_dict 为 true（已设）。
