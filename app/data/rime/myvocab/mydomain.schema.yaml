# Rime schema
# encoding: utf-8
#
# mydomain —— myime 主方案（26 键拼音 + 英文混输 + 用户词频自学习）
#
# 设计要点：
#   1. translator/mymain     主翻译器，全拼，开启 user_dict 自动学习
#   2. translator/mydomain_abbrev  简拼翻译器，只打首字母（bt→崩铁）
#   3. custom_phrase         固定短语，权重锁死，不受用户学习影响
#   4. 英文词条走同一套拼音编码，中英混输无需切换（打 clash 出 Clash）
#
schema:
  schema_id: mydomain
  name: myime拼音
  version: "1.0.0"
  author:
    - myime
  description: |
    26 键拼音方案，内置科技/AI/网络代理 + 原神/崩铁/蔚蓝档案词库。
    支持中英混合联想与用户词频自动学习。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
    abbrev: [ 中, EN ]
  - name: ascii_punct
    states: [ 。，, ．， ]
    abbrev: [ 中, En ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer          # 中英切换（对应键盘 Mode_switch）
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase        # ① 固定短语，优先级最高
    - script_translator@mymain              # ② 主翻译器（含用户词典学习）
    - table_translator@mydomain_abbrev      # ③ 简拼翻译器
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: 'zyxwvutsrqponmlkjihgfedcba'
  delimiter: " '"
  # 全拼 + 简拼由 speller 的模糊音规则承担；不做过度 derive 以免污染全拼
  algebra:
    # ü 输入习惯：lv → lü，nv → nü
    - derive/^([nl])v/$1ü/
    # 容错：常见前后鼻音不区分（可关）
    # - derive/([aeiou])ng$/$1n/

# ------------------------------------------------------------
# ① 固定短语：stabledb，权重写死，用户学习不会顶掉它
# ------------------------------------------------------------
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 2

# ------------------------------------------------------------
# ② 主翻译器：全拼 + 用户词频自学习
# ------------------------------------------------------------
mymain:
  dictionary: mydomain
  # ★ 核心三行：开启用户词典学习
  enable_user_dict: true        # 用户选词上屏后自动记忆并提权
  user_dict: mydomain.user      # 落盘为 <userDataDir>/mydomain.userdb
  db_class: userdb              # userdb=动态词频；stabledb=静态
  enable_completion: true       # 支持编码补全（打前几个音节就出候选）
  enable_sentence: true         # 整句输入
  enable_encoder: false
  initial_quality: 1.0          # 主翻译器基准质量
  comment_format:
    - xform/^/ /
  # 用户词典权重上限，防止单个词被刷到离谱位置
  max_phrase_length: 10
  min_phrase_weight: 1

# ------------------------------------------------------------
# ③ 简拼翻译器：只打首字母，bt → 崩铁
# ------------------------------------------------------------
mydomain_abbrev:
  dictionary: mydomain
  enable_user_dict: true
  user_dict: mydomain.user
  db_class: userdb
  enable_completion: true
  enable_sentence: false
  # ★ initial_quality 不能设太低。
  #   0.6 会把「崩铁」(2000) 压到 1200，排在所有全拼候选后面，
  #   用户打 bt 时首选不是崩铁 —— 体验很差。
  #   设 1.0：简拼与全拼平权，靠词库权重自然排序。
  #   （简拼撞车时，高权重词依然优先，正是我们要的）
  initial_quality: 1.0
  # 简拼结果加前缀提示，与全拼候选区分开
  preedit_format:
    - xform/^/简拼·/
  comment_format:
    - xform/^/ 简拼/

# 易混音节兜底：26 键上 n/ng、shi/shen 这类只差一两个字母，
# 靠 speller 的模糊音规则让它们互相可达，减少「打错查不到词」的挫败感。
speller_extra:
  algebra:
    # yuan shi / yuan shen 互达
    - derive/yuan shen$/yuan shi/
    - derive/yuan shi$/yuan shen/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default

# 简体优先（不依赖 opencc，用内置简繁开关）
simplifier:
  option_name: zh_simp

# 应用用户侧补丁（升级不丢）
__patch:
  - mydomain.custom:/patch?
