name: Build Fork APK

# 触发方式：
#   1. push 到 main/master/develop —— 自动编 debug 包（快，~10 分钟）
#   2. 手动触发（Actions 页 → Run workflow）—— 可选编 debug / release / 两者
#
# 为什么要手动选：debug 与 release 用的是**两套 native 构建配置**
# （CMake Debug vs RelWithDebInfo），两个都编等于把 C++ 全量编译跑两遍，
# CI 时间翻倍。所以 push 时只编 debug，需要签名包时手动选 release。
on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both
      publish_release:
        description: '构建成功后创建 GitHub Release（含可下载产物）'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 只编手机真机在用的两个 ABI，跳过 x86/x86_64 模拟器版：
      # native 层是全量 C++ 编译，少两个 ABI 能把构建时间砍掉约一半，
      # 产物体积也减半（4 个 APK 合计 ~80MB → 2 个 ~40MB）。
      #
      # build-logic 的 NativeBaseConventionPlugin 用
      # `splits.abi { include(BUILD_ABI.split(",")) }` 读取它，
      # 未设置时回退到 Versions.supportedAbis（全部 4 个）。
      # 只出 arm64-v8a：真机是 arm64，多出一个 armeabi-v7a 只会让产物列表变长、
      # 每次下载都要挑。需要 32 位包时改成 "arm64-v8a,armeabi-v7a" 即可。
      BUILD_ABI: arm64-v8a

      # push 事件没有 inputs，统一在这里归一化成 "debug" / "release" / "both"
      VARIANT: ${{ github.event.inputs.variant || 'debug' }}
    steps:
      # 只 checkout 本仓库，submodule 交给后面显式的
      # `git submodule update --init --recursive`（不带 --depth），
      # 和上游 Trime commit-ci.yml 的做法保持一致。
      #
      # 为什么不靠 checkout 自带的 submodules: recursive：
      # .gitmodules 把 librime-lua-deps 指向 hchunhui/librime-lua，
      # 而 superproject 记录的 gitlink 是 9c53b362(lua5.4.6) —— 它只在
      # thirdparty 分支上，不是 master 的 HEAD。浅克隆取不到，目录会静默留空，
      # 于是 librime/plugins/librime-lua/CMakeLists.txt 找不到
      # thirdparty/lua5.4/lua.h，回退去 pkg_check_modules 找系统 lua，
      # 最后 liolib.c 在 NDK r27+ 上报 "call to undeclared function 'fseeko'"。
      - name: Fetch source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # 版本对齐：build-logic/convention/src/main/kotlin/Versions.kt 的
          # DEFAULT_CMAKE / DEFAULT_NDK，以及 app/build.gradle.kts 的
          # compileSdk = 36 / buildToolsVersion = "36.0.0"。
          #
          # NDK 必须在这里预装。交给 AGP 在 Gradle daemon 里按 ndkVersion 自动下载时，
          # 会在配置阶段报 java.net.ConnectException: Connection refused，
          # 直接 "Failed to install the following SDK components: ndk;28.0.13004108" 而 BUILD FAILED。
          "$SDKMGR" --install "platform-tools" "cmake;3.31.6" "ndk;28.0.13004108" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 上游 commit-ci.yml 在编译前显式同步 submodule（无 --depth，
      # 因此能取到 thirdparty 分支上的历史 commit）。
      - name: Fetch submodules
        run: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "--- status ---"
          git submodule status --recursive || true
          echo "--- 校验 in-tree lua 源码 ---"
          test -f app/src/main/jni/librime-lua-deps/lua5.4/lua.h \
            && echo "lua5.4/lua.h: OK" \
            || { echo "lua5.4/lua.h: MISSING"; exit 1; }

      # Trime 的 build-logic 会调 `git config user.name` / `git describe`
      # 取构建元信息。runner 默认没有 git 身份，`git config user.name`
      # 会返回退出码 1 → ProjectExtensions.kt 抛异常。
      - name: Configure git identity (required by Trime build-logic)
        run: |
          git config --global user.name "myime-bot"
          git config --global user.email "myime-bot@users.noreply.github.com"
          echo "git identity: $(git config user.name) <$(git config user.email)>"
          echo "describe: $(git describe --tags --long --always --exclude=nightly 2>&1 | head -1)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 直接用 `make debug`，而不是手写 gradlew 调用。
      # Makefile 的 debug 目标 = patch-apply + :app:assembleDebug，
      # 其中 patch-apply 会执行：
      #   git apply --directory=app/src/main/jni/librime-lua-deps patches/lua.patch
      # 这个补丁把 lua5.4/liolib.c 里 fseeko/ftello 的启用条件改成
      #   #if defined(LUA_USE_POSIX) && \
      #      (!defined(ANDROID) || (defined(__LP64__) || ANDROID_PLATFORM >= 24))
      # 即 32 位且 API<24 的 Android 上退回 fseek。
      # 跳过它就会重现 fseeko 编译错误，所以必须走 Makefile。
      - name: Apply patches
        run: make patch-apply

      # 上游 commit-ci.yml 本来就跑这两步，fork 把它们删掉了，
      # 结果「单元测试有 10 个失败」「代码风格违规」都能长期潜伏 ——
      # 因为原来的工作流只跑 assembleDebug，编译通过就算绿。
      # 这两步放在编译 APK 之前：失败得快，也省得白编译一次 native。
      - name: Check code style
        run: ./gradlew spotlessCheck --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ── 签名配置 ────────────────────────────────────────────────
      # build-logic 的 ProjectExtensions.kt 支持两种来源：
      #   storeFile=<路径>   或   keyBase64=<密钥库的 base64>
      # 这里用 keyBase64：keystore 本体不进仓库，只以 Secret 形式存在。
      # 未配置 Secret 时跳过，release 会产出**未签名**包（装不上，仅用于验证编译）。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 Secret —— release 包将不带签名"
            exit 0
          fi
          {
            echo "keyBase64=$KEYSTORE_BASE64"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties
          echo "keystore.properties 已写入（$(wc -c < keystore.properties) 字节，内容不回显）"

      # ── 编译 ───────────────────────────────────────────────────
      - name: Build debug APK
        if: ${{ env.VARIANT == 'debug' || env.VARIANT == 'both' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ env.VARIANT == 'release' || env.VARIANT == 'both' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # 签名自检：装不上往往就是签名没生效或密钥不对，这里直接打指纹，
      # 省得下载回去才发现。未配置 Secret 时跳过。
      - name: Verify release signature
        if: ${{ (env.VARIANT == 'release' || env.VARIANT == 'both') && hashFiles('keystore.properties') != '' }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' | head -1)
          echo "校验: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      # 注意：splits.abi 会为每个 ABI 生成一个独立 APK，
      # 原先的 `find ... | head -1` 按字母序只拿到一个（x86_64），
      # 导致 Release 里挂的是模拟器版、手机装不上。
      # 这里改成索引全部 APK：首个作为 artifact 的展示路径，
      # 完整列表写进 out/apk-list.txt 供下面的步骤和 Release 使用。
      - name: Locate APKs
        id: apk
        run: |
          set -e
          mkdir -p out
          : > out/apk-list.txt
          for dir in debug release; do
            [ -d "app/build/outputs/apk/$dir" ] || continue
            find "app/build/outputs/apk/$dir" -name "*.apk" -type f | sort >> out/apk-list.txt
          done
          echo "--- 产物列表 ---"
          cat out/apk-list.txt
          echo "count=$(wc -l < out/apk-list.txt)" >> $GITHUB_OUTPUT
          # 至少要有一个 arm64-v8a，否则手机装不上，直接失败提醒
          grep -q "arm64-v8a" out/apk-list.txt \
            || { echo "ERROR: 缺少 arm64-v8a 产物"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myime-apk-${{ env.VARIANT }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # 只有手动触发且勾了 publish_release 才发 Release；
  # push 触发的日常构建只留 artifact（30 天），不污染 Releases 列表。
  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: myime-apk-${{ github.event.inputs.variant }}
          path: apk
      - name: List downloaded APKs
        run: ls -la apk/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: myime v0.1.${{ github.run_number }}
          body: |
            自动化构建产物（GitHub Actions）。基于 Trime develop 分支二次开发。

            ## 该下载哪个？

            | 文件 | 适用设备 |
            |---|---|
            | `*-arm64-v8a-*.apk` | **绝大多数手机**（近几年的 Android 机型） |
            | `*-armeabi-v7a-*.apk` | 老旧 32 位设备 |

            `-debug` 后缀的包名是 `com.osfans.trime.debug`（与正式包并存，可同时安装）；
            `-release` 后缀的包名是 `com.osfans.trime`，已签名，适合长期使用。

            装之前先在系统设置里开启「允许安装未知来源应用」。
          files: apk/**/*.apk
