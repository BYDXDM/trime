name: Build Fork APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with all submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Trime 的 build-logic 会调 `git config user.name` / `git describe`
      # 取构建元信息。runner 默认没有 git 身份，`git config user.name`
      # 会返回退出码 1 → ProjectExtensions.kt:45 抛异常。
      # 这里把身份配上，并把 CI 名字显式传进去。
      - name: Configure git identity (required by Trime build-logic)
        run: |
          git config --global user.name "myime-bot"
          git config --global user.email "myime-bot@users.noreply.github.com"
          echo "git identity: $(git config user.name) <$(git config user.email)>"
          echo "describe: $(git describe --tags --long --always --exclude=nightly 2>&1 | head -1)"

      - name: Show submodule status
        run: git submodule status || true

      # 上游 Trime 的 CI 用 JDK 25；AGP 8.x 要求 >= 17。
      # 取 21 作为折中：满足 AGP，且比 17 更接近上游环境。
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不用 android-actions/setup-android（它自带的 sdkmanager 版本过旧会直接失败）。
      # ubuntu-latest runner 已预装 SDK，直接用 ANDROID_HOME 即可。
      - name: Install SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$(dirname "$APK")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myime-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: myime-debug-apk
          path: apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: myime v0.1.${{ github.run_number }}
          body: |
            自动化构建产物（debug 签名，仅供测试安装）。
            基于 Trime develop 分支二次开发。
          files: apk/*.apk
