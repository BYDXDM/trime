name: Build Fork APK

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 只 checkout 本仓库，submodule 交给后面显式的
      # `git submodule update --init --recursive`（不带 --depth），
      # 和上游 Trime commit-ci.yml 的做法保持一致。
      #
      # 为什么不靠 checkout 自带的 submodules: recursive：
      # .gitmodules 把 librime-lua-deps 指向 hchunhui/librime-lua，
      # 而 superproject 记录的 gitlink 是 9c53b362(lua5.4.6) —— 它只在
      # thirdparty 分支上，不是 master 的 HEAD。浅克隆取不到，目录会静默留空，
      # 于是 librime/plugins/librime-lua/CMakeLists.txt 找不到
      # thirdparty/lua5.4/lua.h，回退去 pkg_check_modules 找系统 lua，
      # 最后 liolib.c 在 NDK r27+ 上报 "call to undeclared function 'fseeko'"。
      - name: Fetch source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          # cmake 版本与上游 commit-ci.yml 对齐；NDK 由 AGP 按 ndkVersion 自动装。
          "$SDKMGR" --install "platform-tools" "cmake;3.31.6"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 上游 commit-ci.yml 在编译前显式同步 submodule（无 --depth，
      # 因此能取到 thirdparty 分支上的历史 commit）。
      - name: Fetch submodules
        run: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive
          echo "--- status ---"
          git submodule status --recursive || true
          echo "--- 校验 in-tree lua 源码 ---"
          test -f app/src/main/jni/librime-lua-deps/lua5.4/lua.h \
            && echo "lua5.4/lua.h: OK" \
            || { echo "lua5.4/lua.h: MISSING"; exit 1; }

      # Trime 的 build-logic 会调 `git config user.name` / `git describe`
      # 取构建元信息。runner 默认没有 git 身份，`git config user.name`
      # 会返回退出码 1 → ProjectExtensions.kt 抛异常。
      - name: Configure git identity (required by Trime build-logic)
        run: |
          git config --global user.name "myime-bot"
          git config --global user.email "myime-bot@users.noreply.github.com"
          echo "git identity: $(git config user.name) <$(git config user.email)>"
          echo "describe: $(git describe --tags --long --always --exclude=nightly 2>&1 | head -1)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 直接用 `make debug`，而不是手写 gradlew 调用。
      # Makefile 的 debug 目标 = patch-apply + :app:assembleDebug，
      # 其中 patch-apply 会执行：
      #   git apply --directory=app/src/main/jni/librime-lua-deps patches/lua.patch
      # 这个补丁把 lua5.4/liolib.c 里 fseeko/ftello 的启用条件改成
      #   #if defined(LUA_USE_POSIX) && \
      #      (!defined(ANDROID) || (defined(__LP64__) || ANDROID_PLATFORM >= 24))
      # 即 32 位且 API<24 的 Android 上退回 fseek。
      # 跳过它就会重现 fseeko 编译错误，所以必须走 Makefile。
      - name: Apply patches
        run: make patch-apply

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -la "$(dirname "$APK")"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myime-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: myime-debug-apk
          path: apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: myime v0.1.${{ github.run_number }}
          body: |
            自动化构建产物（debug 签名，仅供测试安装）。
            基于 Trime develop 分支二次开发。
          files: apk/*.apk
